<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nueva publicación - Huancayoga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/admin/dashboard">Panel Huancayoga</a>
        <a href="/admin/publicaciones" class="btn btn-light btn-sm">Volver</a>
    </div>
</nav>

<section class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow p-4">
                <h2 class="text-success text-center mb-4">
                    Nueva publicación
                </h2>

                <form method="POST" action="/admin/publicaciones/nueva">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text" name="titulo" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contenido o monólogo</label>
                        <textarea name="contenido" class="form-control" rows="8" required></textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-select" required>
                            <option value="monologo">Monólogo</option>
                            <option value="frase">Frase</option>
                            <option value="noticia">Noticia</option>
                            <option value="foto">Fotografía</option>
                            <option value="promocion">Promoción</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombre de imagen</label>
                        <input type="text"
                               name="imagen"
                               class="form-control"
                               placeholder="ejemplo: meditacion_01.jpg">

                        <div class="form-text">
                            La imagen debe estar dentro de static/img/publicaciones/
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Publicar y notificar clientes
                    </button>

                    <a href="/admin/publicaciones"
                       class="btn btn-outline-secondary w-100 mt-2">
                        Cancelar
                    </a>

                </form>
            </div>

        </div>
    </div>
</section>

</body>
</html>
