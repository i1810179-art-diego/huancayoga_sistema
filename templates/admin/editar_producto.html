<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar producto - Huancayoga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/admin/dashboard">Panel Huancayoga</a>

            <div>
                <a href="/admin/dashboard" class="btn btn-light btn-sm">Dashboard</a>
                <a href="/admin/reservas" class="btn btn-light btn-sm">Reservas</a>
                <a href="/admin/pedidos" class="btn btn-light btn-sm">Pedidos</a>
                <a href="/admin/productos" class="btn btn-warning btn-sm">Productos</a>
                <a href="/" class="btn btn-outline-light btn-sm">Ver web</a>
                <a href="/admin/logout" class="btn btn-danger btn-sm">Salir</a>
            </div>
        </div>
    </nav>

    <section class="container mt-5 mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7">

                <div class="card shadow p-4">
                    <h2 class="text-success text-center mb-4">
                        Editar producto
                    </h2>

                    <form method="POST" action="/admin/productos/editar/{{ producto[0] }}">

                        <div class="mb-3">
                            <label class="form-label">Nombre del producto</label>
                            <input type="text" name="nombre" class="form-control" value="{{ producto[1] }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea name="descripcion" class="form-control" rows="3" required>{{ producto[2] }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Precio</label>
                            <input type="number" step="0.01" name="precio" class="form-control" value="{{ producto[3] }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Stock</label>
                            <input type="number" name="stock" class="form-control" value="{{ producto[4] }}" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Nombre de imagen</label>
                            <input type="text" name="imagen" class="form-control" value="{{ producto[5] }}">
                            <div class="form-text">
                                La imagen debe estar dentro de static/img/productos/
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Estado</label>
                            <select name="estado" class="form-select">
                                <option value="activo" {% if producto[6] == 'activo' %}selected{% endif %}>Activo</option>
                                <option value="inactivo" {% if producto[6] == 'inactivo' %}selected{% endif %}>Inactivo</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Actualizar producto
                        </button>

                        <a href="/admin/productos" class="btn btn-outline-secondary w-100 mt-2">
                            Volver
                        </a>

                    </form>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
