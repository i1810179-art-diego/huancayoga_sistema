<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar publicación - Huancayoga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<section class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card shadow p-4">
                <h2 class="text-success text-center mb-4">
                    Editar publicación
                </h2>

                <form method="POST"
                      action="/admin/publicaciones/editar/{{ publicacion[0] }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label">Título</label>
                        <input type="text"
                               name="titulo"
                               class="form-control"
                               value="{{ publicacion[1] }}"
                               required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Contenido</label>
                        <textarea name="contenido"
                                  class="form-control"
                                  rows="8"
                                  required>{{ publicacion[2] }}</textarea>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Imagen</label>
                        <input type="text"
                               name="imagen"
                               class="form-control"
                               value="{{ publicacion[3] or '' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Tipo</label>
                        <select name="tipo" class="form-select">
                            <option value="monologo" {% if publicacion[4] == 'monologo' %}selected{% endif %}>Monólogo</option>
                            <option value="frase" {% if publicacion[4] == 'frase' %}selected{% endif %}>Frase</option>
                            <option value="noticia" {% if publicacion[4] == 'noticia' %}selected{% endif %}>Noticia</option>
                            <option value="foto" {% if publicacion[4] == 'foto' %}selected{% endif %}>Fotografía</option>
                            <option value="promocion" {% if publicacion[4] == 'promocion' %}selected{% endif %}>Promoción</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select name="estado" class="form-select">
                            <option value="activo" {% if publicacion[5] == 'activo' %}selected{% endif %}>Activo</option>
                            <option value="inactivo" {% if publicacion[5] == 'inactivo' %}selected{% endif %}>Inactivo</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Actualizar publicación
                    </button>

                    <a href="/admin/publicaciones"
                       class="btn btn-outline-secondary w-100 mt-2">
                        Volver
                    </a>

                </form>
            </div>

        </div>
    </div>
</section>

</body>
</html>
