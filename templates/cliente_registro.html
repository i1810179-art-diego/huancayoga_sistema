<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro cliente - Huancayoga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Huancayoga</a>

        <div>
            <a href="/" class="btn btn-light btn-sm">Inicio</a>
            <a href="/cliente/login" class="btn btn-light btn-sm">Ingresar</a>
            
        </div>
    </div>
</nav>

<section class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4">
                <h2 class="text-center text-success mb-3">Registro de cliente</h2>

                <p class="text-center">
                    Regístrate para poder reservar citas y comprar productos.
                </p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">

    <label>DNI</label>
    <div class="input-group mb-3">
        <input
            type="text"
            name="dni"
            id="dni"
            class="form-control"
            maxlength="8"
            required>

        <button
            type="button"
            class="btn btn-success"
            onclick="buscarDNI()">
            Buscar DNI
        </button>
    </div>

    <div id="mensaje-reniec" class="mb-3"></div>

    <label>Nombres</label>
    <input
        type="text"
        name="nombres"
        id="nombres"
        class="form-control"
        required
        readonly>

    <label class="mt-3">Apellido paterno</label>
    <input
        type="text"
        name="apellido_paterno"
        id="apellido_paterno"
        class="form-control"
        required
        readonly>

    <label class="mt-3">Apellido materno</label>
    <input
        type="text"
        name="apellido_materno"
        id="apellido_materno"
        class="form-control"
        required
        readonly>

    <label class="mt-3">Celular</label>
    <input
        type="text"
        name="celular"
        class="form-control"
        required>

    <label class="mt-3">Correo electrónico</label>
    <input
        type="email"
        name="correo"
        class="form-control"
        required>

    <label class="mt-3">Contraseña</label>
    <input
        type="password"
        name="password"
        class="form-control"
        required
        minlength="6">

    <label class="mt-3">Confirmar contraseña</label>
    <input
        type="password"
        name="confirmar_password"
        class="form-control"
        required
        minlength="6">

    <button
        type="submit"
        class="btn btn-success w-100 mt-4">
        Registrarme
    </button>

    <a
        href="/cliente/login"
        class="btn btn-outline-secondary w-100 mt-2">
        Ya tengo cuenta
    </a>

</form>
            </div>

        </div>
    </div>
</section>
<script>
function buscarDNI() {
    const dni = document.getElementById("dni").value.trim();
    const mensaje = document.getElementById("mensaje-reniec");

    if (dni.length !== 8) {
        mensaje.innerHTML = `
            <div class="alert alert-warning">
                Ingresa un DNI válido de 8 dígitos.
            </div>
        `;
        return;
    }

    mensaje.innerHTML = `
        <div class="alert alert-info">
            Buscando datos en RENIEC...
        </div>
    `;

    fetch(`/api/reniec/${dni}`)
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                document.getElementById("nombres").value = data.nombres;
                document.getElementById("apellido_paterno").value = data.apellido_paterno;
                document.getElementById("apellido_materno").value = data.apellido_materno;

                mensaje.innerHTML = `
                    <div class="alert alert-success">
                        Datos encontrados correctamente.
                    </div>
                `;
            } else {
                mensaje.innerHTML = `
                    <div class="alert alert-danger">
                        ${data.mensaje}
                    </div>
                `;
            }
        })
        .catch(error => {
            mensaje.innerHTML = `
                <div class="alert alert-danger">
                    Error al consultar RENIEC.
                </div>
            `;
        });
}
</script>
</body>
</html>
