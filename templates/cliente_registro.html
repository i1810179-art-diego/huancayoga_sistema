<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro cliente - Huancayoga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Huancayoga</a>

        <div>
            <a href="/" class="btn btn-light btn-sm">Inicio</a>
            <a href="/cliente/login" class="btn btn-light btn-sm">Ingresar</a>
            
        </div>
    </div>
</nav>

<section class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-7">

            <div class="card shadow p-4">
                <h2 class="text-center text-success mb-3">Registro de cliente</h2>

                <p class="text-center">
                    Regístrate para poder reservar citas y comprar productos.
                </p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="/cliente/registro">

                    <div class="mb-3">
                        <label class="form-label">DNI</label>
                        <input type="text" name="dni" class="form-control" maxlength="8" value="{{ dni_recibido }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text" name="nombres" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido paterno</label>
                        <input type="text" name="apellido_paterno" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Apellido materno</label>
                        <input type="text" name="apellido_materno" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Celular</label>
                        <input type="text" name="celular" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="correo" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Registrarme
                    </button>

                    <a href="/cliente/login" class="btn btn-outline-secondary w-100 mt-2">
                        Ya tengo cuenta
                    </a>

                </form>
            </div>

        </div>
    </div>
</section>

</body>
</html>
