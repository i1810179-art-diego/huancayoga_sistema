<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login administrador - Huancayoga</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap por CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilos.css') }}">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Huancayoga</a>

            <div>
                <a href="/" class="btn btn-light btn-sm">Inicio</a>
                <a href="/reservar" class="btn btn-light btn-sm">Reservar cita</a>
                <a href="/productos" class="btn btn-light btn-sm">Productos</a>
            </div>
        </div>
    </nav>

    <section class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5">

                <div class="card shadow p-4">
                    <h2 class="text-center text-success mb-4">Panel del dueño</h2>

                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }}">
                                    {{ message }}
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}

                    <form method="POST" action="/admin/login">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label class="form-label">Usuario</label>
                            <input type="text" name="usuario" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contraseña</label>
                            <input type="password" name="password" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Ingresar
                        </button>

                    </form>

                    <div class="alert alert-info mt-3 mb-0">
                        Usuario de prueba: <strong>admin</strong><br>
                        Contraseña: <strong>123456</strong>
                    </div>

                </div>

            </div>
        </div>
    </section>

</body>
</html>
